name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No toolchain input: rustup reads rust-toolchain.toml, so CI and a
      # developer machine run the same clippy.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master as of 2026-09-15
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: JavaScript syntax check
        run: |
          for f in web/*.js; do
            cp "$f" "/tmp/$(basename "${f%.js}").mjs"
            node --check "/tmp/$(basename "${f%.js}").mjs"
          done

      - name: JavaScript tests
        run: node --test web/*.test.mjs

      - name: Install cargo-audit
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit

  e2e:
    name: browser smoke
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master as of 2026-09-15
        with:
          toolchain: 1.94.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install the suite
        working-directory: e2e
        run: npm ci

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # Built here rather than left to the playwright webServer timeout, so a
      # slow cold build is a build step and not a mysterious test failure.
      - name: Build the server
        run: cargo build --release --locked

      - name: Run the suite
        working-directory: e2e
        run: npx playwright test

      - name: Upload the trace
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore

  matrix-sync:
    name: matrix sync (ci ↔ release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the ci.yml and release.yml build matrices
        run: python3 .github/scripts/check_matrix_sync.py

  build:
    name: build · ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: palmcast-x86_64-linux
            zig: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: palmcast-aarch64-linux
            zig: true
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: palmcast-aarch64-macos
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: palmcast-x86_64-macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: palmcast-x86_64-windows
            ext: .exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: palmcast-aarch64-windows
            ext: .exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master as of 2026-09-15
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.asset }}

      - name: Install Zig
        if: matrix.zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - name: Install cargo-zigbuild
        if: matrix.zig
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-zigbuild

      - name: Build (zigbuild)
        if: matrix.zig
        run: cargo zigbuild --release --target ${{ matrix.target }} --locked

      - name: Build (cargo)
        if: ${{ !matrix.zig }}
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Stage artifact
        shell: bash
        run: cp "target/${{ matrix.target }}/release/palmcast${{ matrix.ext }}" "${{ matrix.asset }}${{ matrix.ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}${{ matrix.ext }}
          if-no-files-found: error

  docker:
    name: Build & Publish Docker Image (PR/Edge)
    needs: [build, test]
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: palmcast-x86_64-linux
          path: dist

      - name: Download aarch64 binary
        uses: actions/download-artifact@v4
        with:
          name: palmcast-aarch64-linux
          path: dist

      - name: Stage binaries for the Docker build
        run: |
          mv dist/palmcast-x86_64-linux dist/palmcast-amd64
          mv dist/palmcast-aarch64-linux dist/palmcast-arm64

      - name: Downcase repository name for GHCR tag compat
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tags=ghcr.io/${{ env.REPO_LOWER }}:pr-${{ github.event.pull_request.number }},ghcr.io/${{ env.REPO_LOWER }}:sha-${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          else
            echo "tags=ghcr.io/${{ env.REPO_LOWER }}:edge,ghcr.io/${{ env.REPO_LOWER }}:sha-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
