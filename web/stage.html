<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Palmcast — stage</title>
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/stage.css">
</head>
<body>
<h1 class="visually-hidden">Palmcast stage view</h1>
<main class="stage">
  <div class="pane">
    <div id="slide" class="slide" aria-live="polite"></div>
    <div id="options" class="options" aria-live="polite" hidden></div>
    <p id="timer" class="timer" role="timer" hidden></p>
    <ul id="scores" class="score-list" hidden></ul>
  </div>
</main>
<div id="position" class="corner dim"></div>
<button id="fullscreen" class="fullscreen" aria-label="Full screen">⛶</button>
<div id="qr-overlay" class="qr-overlay" hidden role="dialog" aria-label="Join this room">
  <h2>Join this room</h2>
  <img alt="QR code linking to this room" width="420" height="420">
  <p id="qr-overlay-url" class="qr-url"></p>
</div>
<div id="ended" class="ended" role="status" hidden>
  <h2>This session has ended</h2>
  <p>Ask the presenter for a new link.</p>
</div>
<script type="module" src="/stage.js"></script>
</body>
</html>
