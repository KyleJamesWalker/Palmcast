<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Palmcast</title>
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/new.css">
</head>
<body>
<main class="wrap">
  <header>
    <h1>Palmcast</h1>
    <p class="dim">Write a deck. Everyone in the room follows on their own screen.</p>
  </header>

  <label class="field">
    <span class="label">Your deck</span>
    <textarea id="markdown" spellcheck="false" autocapitalize="sentences"
      aria-describedby="syntax"></textarea>
  </label>

  <p id="syntax" class="dim syntax">
    <code>---</code> on its own line starts a new slide.
    <code>???</code> starts speaker notes only you can see.
  </p>

  <div class="actions">
    <button id="start" class="primary">Start presenting</button>
    <button id="deck-link" class="ghost">Copy deck link</button>
    <span id="count" class="dim"></span>
  </div>
  <p id="loaded" class="dim" role="status" hidden></p>
  <input id="deck-link-url" class="url" readonly hidden
    aria-label="Shareable link to this deck">
  <p id="error" class="error" hidden></p>
</main>
<script type="module" src="/new.js"></script>
</body>
</html>
