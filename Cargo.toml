[package]
name = "palmcast"
version = "0.1.0"
edition = "2024"
description = "Live slides on every screen in the room"
repository = "https://github.com/KyleJamesWalker/Palmcast"
license = "MIT"
readme = "README.md"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23.1"
brotli = { version = "9.0.0", default-features = false, features = ["std"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
futures-util = "0.3.34"
mime_guess = "2.0.5"
pulldown-cmark = { version = "0.13.0", default-features = false, features = ["html"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.10.2"
rmp-serde = "1.3.1"
rust-embed = { version = "8.12.0", features = ["include-exclude"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
zip = { version = "8.6.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "html", "regex-fancy", "dump-load"] }

[profile.release]
strip = true
lto = "fat"
codegen-units = 1

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1.5"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
zip = { version = "8.6.0", default-features = false }
